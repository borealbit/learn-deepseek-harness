name: Course-owned bug report
description: Report a reproducible defect in a lab, plugin, validator, or workflow.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Use only synthetic data. Do not include credentials, private prompts, customer data, or private Session traces. Security findings belong in a private advisory.
  - type: input
    id: path
    attributes:
      label: Affected path
      description: Name the project, plugin, script, or file.
      placeholder: projects/provider-configuration-lab
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Course commit
      placeholder: Full 40-character commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, architecture, Node, package manager, and exact DSH package when applicable.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide the smallest complete command sequence and synthetic fixture.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed credentials, private data, private prompts, and unnecessary Session content.
          required: true
        - label: This is not a vulnerability report.
          required: true
