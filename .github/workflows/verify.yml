name: Course quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: course-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Content and policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Validate course
        run: npm run content:check

  dependency-free-labs:
    name: Dependency-free / ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project:
          - extension-selection-lab
          - provider-configuration-lab
          - safe-change-workspace
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Run checks
        working-directory: projects/${{ matrix.project }}
        run: npm test

  npm-labs:
    name: npm / ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project:
          - delegated-review-workflow
          - mode-comparison-lab
          - release-readiness-agent
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: projects/${{ matrix.project }}/package-lock.json
      - name: Install exact dependencies
        working-directory: projects/${{ matrix.project }}
        run: npm ci --ignore-scripts
      - name: Run static checks
        working-directory: projects/${{ matrix.project }}
        run: npm run check --if-present
      - name: Run tests
        working-directory: projects/${{ matrix.project }}
        run: npm test

  plugins:
    name: pnpm / ${{ matrix.plugin }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - repository-inspector
          - tool-policy-gate
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install exact dependencies
        working-directory: plugins/${{ matrix.plugin }}
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Type-check
        working-directory: plugins/${{ matrix.plugin }}
        run: pnpm run typecheck
      - name: Build and test
        working-directory: plugins/${{ matrix.plugin }}
        run: pnpm test

  capstone-evidence:
    name: Capstone golden evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: projects/release-readiness-agent/package-lock.json
      - name: Install exact dependencies
        working-directory: projects/release-readiness-agent
        run: npm ci --ignore-scripts
      - name: Reproduce golden evidence
        working-directory: projects/release-readiness-agent
        run: npm run evidence -- --approve-write-evidence
      - name: Require a clean golden diff
        working-directory: projects/release-readiness-agent
        run: git diff --exit-code -- evidence/
